name: Pull day activity

# Manual run only. Reads the heatmap section of adsb.lol's public daily archives for a date
# range and publishes one small CSV per day (one row per US aircraft seen that day).
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day, YYYY-MM-DD"
        required: false
      end:
        description: "Last day, YYYY-MM-DD"
        required: false
      dates:
        description: "Instead of first/last: specific days, comma-separated"
        required: false
        default: ""
      jobs:
        description: "Parallel jobs (1-20)"
        required: true
        default: "20"
      slices:
        description: 'Half-hours of the UTC day to read: "all" or e.g. "24-47,0-5"'
        required: true
        default: "all"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
      days: ${{ steps.split.outputs.days }}
      label: ${{ steps.split.outputs.label }}
    steps:
      - id: split
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          DATES: ${{ inputs.dates }}
          JOBS: ${{ inputs.jobs }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, os
          jobs = max(1, min(20, int(os.environ["JOBS"])))
          listed = [d.strip() for d in os.environ["DATES"].split(",") if d.strip()]
          if listed:
              days = sorted({dt.date.fromisoformat(d).isoformat() for d in listed})
              label = f"{days[0]}_{days[-1]}_{len(days)}-listed-days"
          else:
              assert os.environ["START"] and os.environ["END"], "give first and last day, or a list of days"
              start = dt.date.fromisoformat(os.environ["START"])
              end = dt.date.fromisoformat(os.environ["END"])
              assert start <= end, "start must not be after end"
              days = [(start + dt.timedelta(days=i)).isoformat() for i in range((end - start).days + 1)]
              label = f"{days[0]}_{days[-1]}"
          size = -(-len(days) // jobs)
          chunks = [{"from": c[0], "to": c[-1], "dates": ",".join(c)}
                    for c in (days[i:i + size] for i in range(0, len(days), size))]
          print("chunks=" + json.dumps(chunks))
          print("days=" + ",".join(days))
          print("label=" + label)
          PY

  pull:
    needs: plan
    name: pull ${{ matrix.chunk.from }} to ${{ matrix.chunk.to }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read ${{ matrix.chunk.from }} to ${{ matrix.chunk.to }}
        env:
          DATES: ${{ matrix.chunk.dates }}
          SLICES: ${{ inputs.slices }}
        run: python fetch_heatmap.py --dates "$DATES" --slices "$SLICES" --out out --workers 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-${{ matrix.chunk.from }}_${{ matrix.chunk.to }}
          path: out/
          if-no-files-found: warn
          retention-days: 1
          overwrite: true  # "Re-run failed jobs" uploads under the same name

  bundle:
    needs: [plan, pull]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: days
          pattern: part-*
          merge-multiple: true
      - name: Summary
        env:
          DAYS: ${{ needs.plan.outputs.days }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, pathlib
          want = os.environ["DAYS"].split(",")
          files = list(pathlib.Path("days").glob("adsb_day_*.csv.gz"))
          have = {f.name[9:19] for f in files}
          missing = [d for d in want if d not in have]
          print(f"### {len(have)} of {len(want)} days written, {sum(f.stat().st_size for f in files) / 1e6:.0f} MB")
          if missing:
              print(f"\n{len(missing)} days missing: " + ", ".join(missing))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adsb-day-activity_${{ needs.plan.outputs.label }}
          path: days/
          compression-level: 0
          retention-days: 30
          overwrite: true
